# Puts the dataset live now on Cloudflare Pages, where the site reads its
# files from (since 2026-11-13, so Vercel doesn't store a ~350 MB copy with
# every deploy). Run it by hand once to set things up - "Refresh dataset"
# then keeps it current each month - or again if the Cloudflare copy is
# ever lost. Changes nothing on the site itself.
#
# Needs the repository secrets NEXT_PUBLIC_SUPABASE_URL (as for "Refresh
# dataset"), CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Data on Cloudflare

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gather the live dataset's files
        run: node scripts/stage-data-site.mjs .data-site
      - name: Put them on Cloudflare Pages
        run: |
          npx --yes wrangler@4 pages project create piltri-data --production-branch=main || true
          npx --yes wrangler@4 pages deploy .data-site --project-name=piltri-data --branch=main --commit-dirty=true
