# Rebuilds Piltri's precomputed dataset from free bulk sources, puts its
# files on Cloudflare Pages (where the site reads them since 2026-11-13),
# publishes it to Supabase Storage (the switch), then triggers a Vercel
# deploy. See pipeline/README.md.
#
# One-time setup - repository secrets (GitHub -> Settings -> Secrets and
# variables -> Actions):
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY  (same as .env.local)
#   VERCEL_DEPLOY_HOOK_URL  (Vercel -> Project -> Settings -> Git -> Deploy
#                            Hooks, branch "main")
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  (Cloudflare Pages; without
#                            them the Cloudflare step is skipped)
name: Refresh dataset

on:
  schedule:
    - cron: "0 3 2 * *" # monthly, 03:00 UTC on the 2nd
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The Overture extractions dominate (tens of GB of Parquet read from
    # S3); generous headroom so a slow S3 day doesn't kill the run.
    timeout-minutes: 330
    env:
      PIPELINE_CACHE_DIR: ${{ github.workspace }}/.pipeline-cache
      # Parallel downloads for the Overture extracts (S3 throughput is per connection).
      OVERTURE_WORKERS: "4"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The raw downloads and rasters need ~15 GB; the runner image's
      # preinstalled SDKs we don't use free up plenty.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Inputs that never change between runs are cached instead of
      # re-downloaded: WorldClim's mean temperature grid (since 2026-11-13
      # only for telling sea beaches from river banks - the 1991-2020
      # climate figures come from a committed table, so its other five
      # grids are no longer needed), NASA POWER UV climatology, GHS-POP's
      # 2025 grid, the 2024 PM2.5 map, the Köppen maps and UCDP GED 26.1
      # (fixed releases, named by version - a new one is a new file).
      # Everything else (World Bank, WHO, GeoNames, USGS, Overture, Ookla)
      # is fetched fresh.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.pipeline-cache/raw/wc2.1_2.5m_tavg.zip
            ${{ github.workspace }}/.pipeline-cache/raw/power-uv
            ${{ github.workspace }}/.pipeline-cache/raw/GHS_POP_E2025_*
            ${{ github.workspace }}/.pipeline-cache/raw/V6GL03.CNNPM25.GL.*.nc
            ${{ github.workspace }}/.pipeline-cache/raw/koppen_geiger_tif.zip
            ${{ github.workspace }}/.pipeline-cache/raw/ged*-csv.zip
          key: static-inputs-v3
      # Fixed releases too, downloaded once (2026-10-24): WorldPop's 2025 age
      # groups (~5.4 GB) and GHS-POP's 2020 epoch, for the local median age
      # and population growth. A new release gets a new file name.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.pipeline-cache/raw/worldpop-2025
            ${{ github.workspace }}/.pipeline-cache/raw/GHS_POP_E2020_*
          key: static-inputs-population-v1
      # WRI Aqueduct 4.0 (2026-11-07), water for each place's river basin:
      # a fixed 2023 release, 261 MB.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pipeline-cache/raw/aqueduct-4.0/aqueduct-4-0-water-risk-data.zip
          key: static-inputs-aqueduct40-v1
      - run: npm run pipeline:build
      # The new files go to Cloudflare Pages before the switch, next to the
      # live version's, so the live site keeps finding its own until it's
      # redeployed. A failure here stops the run: nothing is switched.
      - name: Put the dataset on Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          node scripts/stage-data-site.mjs .data-site "$(ls -d "$PIPELINE_CACHE_DIR"/out/*/ | sort | tail -n 1)"
          npx --yes wrangler@4 pages project create piltri-data --production-branch=main || true
          npx --yes wrangler@4 pages deploy .data-site --project-name=piltri-data --branch=main --commit-dirty=true
      - run: npm run pipeline:publish
      - name: Deploy the site with the new dataset
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
