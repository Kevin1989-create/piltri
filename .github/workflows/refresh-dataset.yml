# Rebuilds Piltri's precomputed dataset from free bulk sources, publishes it
# to Supabase Storage, then triggers a Vercel deploy - the site bundles the
# dataset at build time and serves it from its own CDN. See
# pipeline/README.md.
#
# One-time setup - repository secrets (GitHub -> Settings -> Secrets and
# variables -> Actions):
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY  (same as .env.local)
#   VERCEL_DEPLOY_HOOK_URL  (Vercel -> Project -> Settings -> Git -> Deploy
#                            Hooks, branch "main")
name: Refresh dataset

on:
  schedule:
    - cron: "0 3 2 * *" # monthly, 03:00 UTC on the 2nd
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The Overture extractions dominate (tens of GB of Parquet read from
    # S3); generous headroom so a slow S3 day doesn't kill the run.
    timeout-minutes: 330
    env:
      PIPELINE_CACHE_DIR: ${{ github.workspace }}/.pipeline-cache
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      # The raw downloads and rasters need ~15 GB; the runner image's
      # preinstalled SDKs we don't use free up plenty.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Inputs that never change between runs (WorldClim climate normals,
      # NASA POWER UV climatology) are cached instead of re-downloaded.
      # Everything else (World Bank, WHO, GeoNames, USGS, Overture, Ookla,
      # air quality, population) is fetched fresh.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.pipeline-cache/raw/wc2.1_*
            ${{ github.workspace }}/.pipeline-cache/raw/power-uv
          key: static-inputs-v2
      - run: npm run pipeline
      - name: Deploy the site with the new dataset
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
